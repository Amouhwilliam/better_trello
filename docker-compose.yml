services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data   # persists the SQLite DB file across restarts
    environment:
      - DATABASE_URL=sqlite:////app/data/tasks.db
      - AUTO_COMPLETE_PROJECT=false
    restart: unless-stopped

  datasette:
    image: datasetteproject/datasette
    ports:
      - "8081:8001"
    volumes:
      - sqlite_data:/data
    command: ["datasette", "/data/tasks.db", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlite_data:   # named volume — Docker manages the lifecycle of the DB file
